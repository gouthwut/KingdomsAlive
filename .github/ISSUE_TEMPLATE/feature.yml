name: Feature request
description: Propose a change to gameplay or project tooling.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the player or contributor experience you want to change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what should happen and how someone could verify it.
    validations:
      required: true
